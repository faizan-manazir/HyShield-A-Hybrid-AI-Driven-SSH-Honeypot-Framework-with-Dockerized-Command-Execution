# ============================================================================
# General Cowrie Options
# ============================================================================
[honeypot]

# Sensor name
#sensor_name=myhostname

# Hostname displayed in fake shell prompt
hostname = web-prod-01

# Log directory
log_path = var/log/cowrie

# Downloads directory
download_path = ${honeypot:state_path}/downloads

# Static data files
data_path = src/cowrie/data

# Variable state files
state_path = var/lib/cowrie

# Config files directory
etc_path = etc

# Virtual file contents directory
contents_path = honeyfs

filesystem = fs.pickle

# Simple text commands directory
txtcmds_path = txtcmds

# Max download size (0 = unlimited)
#download_limit_size = 10485760

# TTY session logging
ttylog = true
ttylog_path = ${honeypot:state_path}/tty

# Idle timeout in seconds
idle_timeout = 180

# Authentication timeout in seconds
authentication_timeout = 120

# Backend: llm
backend = llm

# Log rotation
logtype = rotating

# Timezone
timezone = UTC


# ============================================================================
# Authentication Options
# ============================================================================

# AuthRandom: accepts any password after 3-5 attempts (realistic brute force)
auth_class = UserDB

# ============================================================================
# LLM Options
# ============================================================================
[llm]

# Groq API key — paste yours here
api_key = 

# Model
model = llama-3.3-70b-versatile

# Groq API endpoint
host = https://api.groq.com
path = /openai/v1/chat/completions

# Response settings
max_tokens = 500
temperature = 0.7

# Disable debug in production to reduce log noise
debug = false

# System prompt for interactive SSH sessions
system_prompt = "You are an output refinement engine for a realistic Ubuntu 22.04 LTS production Linux server. A real Docker container executes commands and produces the true shell output. Your job is ONLY to slightly refine, sanitize, or enhance the realism of the existing terminal output while preserving accuracy and consistency. Strict rules: 1) Never invent command execution results unless explicitly requested. 2) Never simulate filesystem behavior yourself. 3) Never explain commands. 4) Never mention AI, simulation, prompts, or language models. 5) Preserve realistic Linux behavior exactly. 6) Keep outputs concise and natural. 7) If the original output is already realistic, return it unchanged. 8) Silence should remain silence for commands like successful cd operations. 9) Maintain consistency with Ubuntu 22.04 LTS and Linux kernel 5.15.0-91-generic x86_64. 10) Remove unrealistic artifacts, hallucinations, commentary, or broken shell behavior. 11) Never add conversational text or meta-commentary. 12) The server hostname is edge-gw-prod-01. 13) Behave like a transparent realism enhancement layer sitting behind a real Linux shell."

# ============================================================================
# Shell Options
# ============================================================================
[shell]

filesystem = ${honeypot:data_path}/fs.pickle
processes = ${honeypot:data_path}/cmdoutput.json
arch = linux-x64-lsb

# Realistic Ubuntu 22.04 kernel info
kernel_version = 5.15.0-91-generic
kernel_build_string = #101-Ubuntu SMP Tue Nov 14 13:30:08 UTC 2023
hardware_platform = x86_64
operating_system = GNU/Linux

# SSH version shown by ssh -V
ssh_version = OpenSSH_8.9p1, OpenSSL 3.0.2 15 Mar 2022


# ============================================================================
# SSH Options
# ============================================================================
[ssh]

enabled = true

# SSH key files (auto-created if missing)
rsa_public_key = ${honeypot:state_path}/ssh_host_rsa_key.pub
rsa_private_key = ${honeypot:state_path}/ssh_host_rsa_key
ecdsa_public_key = ${honeypot:state_path}/ssh_host_ecdsa_key.pub
ecdsa_private_key = ${honeypot:state_path}/ssh_host_ecdsa_key
ed25519_public_key = ${honeypot:state_path}/ssh_host_ed25519_key.pub
ed25519_private_key = ${honeypot:state_path}/ssh_host_ed25519_key

public_key_auth = ssh-rsa,ecdsa-sha2-nistp256,ssh-ed25519

# SSH banner — looks like a real Ubuntu 22.04 server
version = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.6

ciphers = aes128-ctr,aes192-ctr,aes256-ctr,aes256-cbc,aes192-cbc,aes128-cbc,3des-cbc,cast128-cbc
macs = hmac-sha2-512,hmac-sha2-384,hmac-sha2-256,hmac-sha1,hmac-md5
compression = zlib@openssh.com,zlib,none

# Listen on port 2222
listen_endpoints = tcp:2222:interface=0.0.0.0

sftp_enabled = true
forwarding = true
forward_redirect = false
forward_tunnel = false
auth_none_enabled = false
auth_publickey_allow_any = false
auth_keyboard_interactive_enabled = false


# ============================================================================
# Telnet (disabled)
# ============================================================================
[telnet]
enabled = false
listen_endpoints = tcp:2223:interface=0.0.0.0


# ============================================================================
# Output: JSON log (primary output for SIEM in Phase 3)
# ============================================================================
[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
epoch_timestamp = false

# ============================================================================
# Output: Text audit log
# ============================================================================
[output_textlog]
enabled = true
logfile = ${honeypot:log_path}/audit.log
format = text

# ============================================================================
# All other outputs disabled
# ============================================================================
[output_elasticsearch]
enabled = false

[output_mysql]
enabled = false

[output_sqlite]
enabled = false

[output_mongodb]
enabled = false

[output_redis]
enabled = false

[output_kafka]
enabled = false

[output_influx]
enabled = false

[output_splunk]
enabled = false

[output_slack]
enabled = false

[output_telegram]
enabled = false

[output_discord]
enabled = false

[output_virustotal]
enabled = false

[output_reversedns]
enabled = false

[output_greynoise]
enabled = false

[output_abuseipdb]
enabled = false

[output_dshield]
enabled = false

[output_crashreporter]
enabled = false

[output_localsyslog]
enabled = false

[output_prometheus]
enabled = false

[output_hpfeeds3]
enabled = false

[output_s3]
enabled = false

[output_misp]
enabled = false

[output_datadog]
enabled = false

[output_rmq]
enabled = false

[output_xmpp]
enabled = false

[bridge]
host = 127.0.0.1
port = 5050
