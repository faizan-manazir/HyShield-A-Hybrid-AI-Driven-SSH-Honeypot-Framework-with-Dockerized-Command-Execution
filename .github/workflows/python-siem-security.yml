name: Python SIEM Security Checks

on:
  # Run on every PR so cleanup/refactoring changes still validate the sole
  # supported SIEM implementation, even when Python files are not modified.
  pull_request:
  push:
    branches:
      - main
      - "audit/**"
      - "fix/**"
    paths:
      - "python-siem/**"
      - ".github/workflows/python-siem-security.yml"

permissions:
  contents: read

jobs:
  tests-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: python-siem
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python-siem/requirements.txt
      - name: Install application and audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pip-audit bandit
      - name: Run test suite
        run: python -m pytest -q
      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt
      - name: Static security scan
        run: bandit -r app -ll -x tests -s B324
