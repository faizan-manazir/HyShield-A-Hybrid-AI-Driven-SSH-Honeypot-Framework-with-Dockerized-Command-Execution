name: Dependency Remediation Preview

on:
  push:
    branches:
      - "fix/siem-api-hardening"
    paths:
      - ".github/workflows/dependency-remediation-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: siem-dashboard/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: siem-dashboard/backend/package-lock.json
      - run: npm ci
      - name: Apply compatible patch/minor dependency fixes
        run: npm audit fix
      - name: Validate backend
        run: timeout 120s npm test
      - name: Export proposed lockfile and audit report
        if: always()
        run: |
          npm audit --json > audit-report.json || true
          mkdir -p ../../remediation-artifacts/backend
          cp package.json package-lock.json audit-report.json ../../remediation-artifacts/backend/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-remediation-preview
          path: remediation-artifacts/backend/
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: siem-dashboard/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: siem-dashboard/frontend/package-lock.json
      - run: npm ci
      - name: Upgrade Next.js and matching ESLint config to patched 16.x
        run: npm install --save-exact next@16.4.0 eslint-config-next@16.4.0
      - name: Override vulnerable transitive braces release
        run: npm pkg set 'overrides.braces=^3.0.4'
      - name: Apply compatible patch/minor dependency fixes
        run: npm audit fix
      - name: Validate frontend production build
        run: npm run build
      - name: Export proposed lockfile and audit report
        if: always()
        run: |
          npm audit --json > audit-report.json || true
          mkdir -p ../../remediation-artifacts/frontend
          cp package.json package-lock.json audit-report.json ../../remediation-artifacts/frontend/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-remediation-preview
          path: remediation-artifacts/frontend/
          if-no-files-found: error

  commit-remediation:
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/siem-api-hardening
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: backend-remediation-preview
          path: /tmp/backend-remediation
      - uses: actions/download-artifact@v4
        with:
          name: frontend-remediation-preview
          path: /tmp/frontend-remediation
      - name: Apply validated dependency manifests and lockfiles
        run: |
          cp /tmp/backend-remediation/package.json siem-dashboard/backend/package.json
          cp /tmp/backend-remediation/package-lock.json siem-dashboard/backend/package-lock.json
          cp /tmp/frontend-remediation/package.json siem-dashboard/frontend/package.json
          cp /tmp/frontend-remediation/package-lock.json siem-dashboard/frontend/package-lock.json
      - name: Commit validated dependency updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add siem-dashboard/backend/package.json siem-dashboard/backend/package-lock.json siem-dashboard/frontend/package.json siem-dashboard/frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "fix: remediate npm dependency security advisories"
          git push origin HEAD:fix/siem-api-hardening
